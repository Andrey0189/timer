[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-timer"
version = "1.0.0"
description = "A minimalist CLI timer, stopwatch, and pomodoro tool in Python with zero dependencies."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
keywords = ["timer", "stopwatch", "pomodoro", "cli", "minimalist", "tui", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
timer = "timer:main"
stopwatch = "timer:main"
